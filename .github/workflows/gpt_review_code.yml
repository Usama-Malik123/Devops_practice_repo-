name: PR Review with OpenRouter

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}   # 👈 needed for gh CLI
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # 👈 make sure you added this in repo secrets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate PR diff
        run: |
          git fetch origin main
          git diff origin/main...HEAD > pr.diff

      - name: Call OpenRouter API
        run: |
          RAW_RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"openai/gpt-5-mini\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"You are a code reviewer. Provide a short review of this PR diff.\"},
                {\"role\": \"user\", \"content\": $(jq -Rs . < pr.diff)}
              ]
            }")

          echo "$RAW_RESPONSE" | jq -r '.choices[0].message.content' > review.txt

      - name: Post PR Comment
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review.txt
