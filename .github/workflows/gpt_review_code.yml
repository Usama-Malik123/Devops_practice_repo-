name: GPT Auto Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh jq

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff ${{ github.event.pull_request.number }} > pr.diff
 newbranch1
      - name: Review with GPT (GPT-4.1)

      - name: Review with GPT (GPT-5-nano)
 master
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REVIEW=$(jq -Rs . < pr.diff | xargs -0 -I{} \
            curl -s https://openrouter.ai/api/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -d '{
 newbranch1
                "model": "openai/gpt-4.1",
                "model": "openai/gpt-5-nano",
 master
                "messages": [
                  {"role": "system", "content": "You are a senior software engineer reviewing GitHub PRs."},
                  {"role": "user", "content": "Repository: '"$REPO"'\nPR Number: '"$PR_NUMBER"'\n\nDiff:\n{} \n\nPlease review this pull request with a focus on:\n- Code quality\n- Potential bugs\n- Security concerns\n- Performance improvements"}
                ],
 newbranch1
                "max_tokens": 600

                "max_tokens": 500
 master
              }' | jq -r '.choices[0].message.content')

          echo "$REVIEW" > review.txt

      - name: Post comment to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review.txt
