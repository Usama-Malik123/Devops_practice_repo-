name: GPT Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: sudo apt-get update && sudo apt-get install -y gh jq

      - run: gh pr diff ${{ github.event.pull_request.number }} > pr.diff
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Review with GPT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DIFF=$(cat pr.diff)
          BODY=$(jq -n \
            --arg model "gpt-4.1-mini" \
            --arg repo "$REPO" \
            --arg pr "$PR_NUMBER" \
            --arg diff "$DIFF" \
            '{
              model: $model,
              messages: [
                {role: "system", content: "You are a senior software engineer reviewing GitHub PRs."},
                {role: "user", content: "Repository: \($repo)\nPR Number: \($pr)\n\nDiff:\n\($diff)\n\nPlease review this pull request with a focus on:\n- Bugs & edge cases\n- Security issues\n- Performance improvements\n- Code quality & maintainability"}
              ],
              max_tokens: 800
            }')
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$BODY")
          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          [ -z "$REVIEW" ] && REVIEW="⚠️ GPT did not return a response."
          echo "$REVIEW" > review.txt

      - run: gh pr comment ${{ github.event.pull_request.number }} --body-file review.txt
        env:
          GH_TOKEN: ${{ github.token }}
