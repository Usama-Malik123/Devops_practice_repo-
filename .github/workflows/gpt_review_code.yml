name: GPT Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI + jq
        run: sudo apt-get update && sudo apt-get install -y gh jq

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff ${{ github.event.pull_request.number }} > pr.diff

      - name: Review with GPT (OpenAI GPT-5-mini)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Convert diff into safe JSON string
          DIFF=$(cat pr.diff | jq -Rs .)

          # Call OpenAI API
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{
              \"model\": \"gpt-4.1-mini\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"You are a senior software engineer reviewing GitHub PRs.\"},
                {\"role\": \"user\", \"content\": \"Repository: $REPO\nPR Number: $PR_NUMBER\n\nDiff:\n$DIFF\n\nPlease review this pull request with a focus on:\n- Bugs & edge cases\n- Security issues\n- Performance improvements\n- Code quality & maintainability\n- Frontend/backend/monorepo best practices\"}
              ],
              \"max_tokens\": 200
            }")

          # Debug (uncomment if you need to see full response)
          # echo "$RESPONSE" | jq

          # Extract review text
          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          # Fallback if API failed
          if [ -z "$REVIEW" ] || [ "$REVIEW" == "null" ]; then
            REVIEW="⚠️ GPT did not return a response. Please check the workflow logs for details."
          fi

          echo "$REVIEW" > review.txt

      - name: Post comment to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review.txt
