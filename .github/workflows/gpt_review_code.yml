name: GPT Auto Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh jq

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff ${{ github.event.pull_request.number }} > pr.diff

      - name: Review with GPT (GPT-5-nano)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          RAW_RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"openai/gpt-5-nano\",
              \"messages\": [
          {\"role\": \"system\", \"content\": \"You are a GitHub PR reviewer.\"},
          {\"role\": \"user\", \"content\": $(jq -Rs . < pr.diff)}
           ]
           }")

          echo "$RAW_RESPONSE" | jq -r '.choices[0].message.content' > review.txt

           gh pr comment 68 --body-file review.txt

      - name: Post comment to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review.txt
